<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#263c33" />
    <title>Маме</title>
    <style>
      :root {
        font-family: Georgia, serif;
        color: #242c24;
        background: #263c33;
        color-scheme: light;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-width: 280px;
      }
      .sky {
        position: fixed;
        inset: 0;
        overflow: hidden;
        pointer-events: none;
        background-color: #263c33;
        background-image: radial-gradient(
          ellipse 44% 55% at var(--x, 65%) var(--y, 50%),
          #53664e,
          transparent
        );
      }
      .fault {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        opacity: 0.28;
        transform: translateX(var(--drift, 0px));
      }
      .ray {
        position: absolute;
        top: -15vh;
        width: 1px;
        height: 9vh;
        background: linear-gradient(transparent, #e0d0a777);
        animation: fall var(--duration) var(--delay) linear infinite;
      }
      @keyframes fall {
        to {
          transform: translateY(116vh);
        }
      }
      main {
        position: relative;
        min-height: 100svh;
        display: grid;
        place-items: center;
        padding: clamp(25px, 6vw, 80px) 20px;
      }
      .card {
        width: min(980px, 100%);
        background-color: #f3ecd9;
        background-image: repeating-linear-gradient(0deg, #5c482403 0 1px, transparent 1px 4px);
        box-shadow: 0 28px 70px #101d17a0;
        padding: clamp(24px, 5vw, 64px);
        display: grid;
        grid-template-columns: minmax(0, 1.13fr) minmax(0, 1fr);
        align-items: center;
        gap: clamp(24px, 6vw, 76px);
      }
      h1 {
        font-size: clamp(42px, 6vw, 76px);
        font-weight: 400;
        line-height: 1;
        margin: 0 0 24px;
        letter-spacing: -0.055em;
      }
      p {
        max-width: 32ch;
        font-size: clamp(17px, 1.8vw, 21px);
        line-height: 1.5;
        margin: 0 0 14px;
      }
      .signature {
        margin-top: 22px;
        font-style: italic;
      }
      .actions {
        margin-top: 28px;
      }
      button {
        font:
          600 15px system-ui,
          sans-serif;
        min-height: 44px;
        padding: 12px 18px;
        color: #fff5e3;
        background: #8c372d;
        border: 0;
        border-radius: 3px;
        cursor: pointer;
      }
      button:hover {
        background: #6e2c24;
      }
      button:focus-visible {
        outline: 2px solid #8c372d;
        outline-offset: 4px;
      }
      figure {
        margin: 0;
        min-width: 0;
        padding: 10px 10px 0;
        background: #fff8e8;
        box-shadow: 1px 7px 15px #44351d32;
        transform: rotate(2deg);
      }
      .photo {
        position: relative;
        display: grid;
        place-items: center;
        aspect-ratio: 0.89;
        overflow: hidden;
        background: #d5dbbe;
      }
      .photo img {
        position: absolute;
        height: 90%;
        max-width: 97%;
        object-fit: contain;
        translate: var(--cat-x, 0px) var(--cat-y, 0px);
        transition:
          opacity 0.22s,
          scale 0.22s;
        filter: drop-shadow(1px 6px 5px #41472b46);
      }
      #gift {
        opacity: 0;
        scale: 0.94;
      }
      [data-open] #gift {
        opacity: 1;
        scale: 1;
      }
      [data-open] #cat {
        opacity: 0;
        scale: 0.94;
      }
      .photo.purr img {
        animation: purr 0.38s ease;
      }
      @keyframes purr {
        35% {
          rotate: -4deg;
        }
        70% {
          rotate: 3deg;
        }
      }
      figcaption {
        display: flex;
        justify-content: space-between;
        gap: 8px;
        align-items: center;
        min-height: 56px;
        color: #454c3b;
        padding: 4px 3px;
        font-size: 16px;
      }
      .pet {
        flex: none;
        background: none;
        color: #454c3b;
        padding: 6px 4px;
        text-decoration: underline;
        text-underline-offset: 3px;
        font-weight: 400;
      }
      .pet:hover {
        background: none;
        color: #8c372d;
      }
      @media (max-width: 660px) {
        .card {
          grid-template-columns: 1fr;
          gap: 24px;
          max-width: 420px;
        }
        h1 {
          margin-bottom: 15px;
        }
        .actions {
          margin-top: 20px;
        }
        figure {
          width: min(100%, 275px);
          margin: auto;
          transform: rotate(1deg);
        }
        .photo {
          aspect-ratio: 1;
        }
        .signature {
          margin-top: 16px;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation: none !important;
          transition: none !important;
        }
        .photo img,
        .fault {
          translate: none;
          transform: none;
        }
      }

      .envelope {
        width: min(680px, 94vw);
        aspect-ratio: 1.65;
        position: relative;
        isolation: isolate;
        display: grid;
        align-content: end;
        justify-items: start;
        padding: clamp(22px, 5vw, 58px);
        color: #352d24;
        background: #e6cfa8;
        box-shadow: 0 25px 65px #10231999;
        cursor: pointer;
        overflow: hidden;
        border: 0;
        border-radius: 2px;
        text-align: left;
        font:
          400 18px Georgia,
          serif;
      }
      .envelope:hover {
        background: #edd8b5;
      }
      .envelope::before {
        content: "";
        position: absolute;
        inset: 0;
        z-index: -1;
        background: linear-gradient(155deg, #fbebc9, #d7b98e);
        clip-path: polygon(0 0, 100% 0, 50% 66%);
        transform-origin: top;
        transition: transform 0.45s ease-in;
      }
      .envelope::after {
        content: "♥";
        position: absolute;
        top: 48%;
        left: 50%;
        transform: translate(-50%, -50%);
        border-radius: 46% 50% 44% 50%;
        padding: 12px 16px;
        color: #eed4ab;
        background: #913c31;
        box-shadow:
          inset 0 0 0 3px #a54b40,
          1px 3px 4px #51291955;
      }
      .envelope strong {
        font:
          italic clamp(36px, 6vw, 68px) Georgia,
          serif;
        letter-spacing: -0.05em;
      }
      .envelope small {
        font: 14px system-ui;
        margin-top: 6px;
      }
      .envelope.opening::before {
        transform: rotateX(85deg);
      }
      .envelope.opening::after {
        opacity: 0;
      }
      [hidden] {
        display: none !important;
      }
      .card.arrive {
        animation: unfold 0.55s ease-out;
      }
      @keyframes unfold {
        from {
          opacity: 0;
          transform: translateY(24px) rotate(-2deg);
        }
      }
      figure {
        position: relative;
      }
      figure::before {
        content: "";
        position: absolute;
        z-index: 1;
        pointer-events: none;
        top: -8px;
        left: 38%;
        width: 24%;
        height: 19px;
        transform: rotate(-6deg);
        background:
          repeating-linear-gradient(96deg, #ba925313 0 1px, transparent 1px 4px), #dcbf86a8;
        clip-path: polygon(
          1% 0,
          98% 2%,
          100% 19%,
          98% 40%,
          100% 66%,
          98% 98%,
          0 100%,
          2% 76%,
          0 50%,
          2% 23%
        );
      }
      .ink-heart {
        display: inline-block;
        margin-left: 0.35em;
        color: #933e36;
        font:
          1.15em Georgia,
          serif;
        transform: rotate(-12deg);
      }

      main {
        grid-template-columns: minmax(0, 1fr);
      }
      .envelope {
        width: min(680px, 100%);
        animation: delivery 0.65s ease-out both;
      }
      @keyframes delivery {
        from {
          opacity: 0;
          transform: translateY(-16px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      @media (max-width: 660px) {
        main {
          padding: 64px 14px 22px;
        }
        .card {
          width: 100%;
          padding: 24px 20px;
          grid-template-columns: minmax(0, 1fr);
          gap: 20px;
        }
        .envelope {
          aspect-ratio: 1.42;
        }
        .card figure {
          width: min(86%, 260px);
        }
        .card p {
          max-width: none;
        }
        .actions button {
          width: 100%;
        }
        .photo {
          scroll-margin: 18px;
        }
      }

      .draft {
        box-sizing: border-box;
        width: min(580px, 100%);
        padding: clamp(26px, 6vw, 56px);
        background: #f3ecd9;
        box-shadow: 0 18px 48px #15211966;
      }
      .draft h1 {
        font-size: clamp(32px, 5vw, 52px);
      }
      .strokes {
        margin: 24px 0;
        min-height: 5.5em;
        font:
          italic clamp(20px, 3.6vw, 29px)/1.65 Georgia,
          serif;
        background: repeating-linear-gradient(
          transparent 0 calc(1.65em - 1px),
          #a6a58166 calc(1.65em - 1px) 1.65em
        );
      }
      .nib {
        position: relative;
        display: inline-block;
        width: 0;
        height: 1em;
      }
      @keyframes scribble {
        to {
          transform: rotate(-7deg) translateY(-2px);
        }
      }

      .nib svg {
        position: absolute;
        left: -2px;
        bottom: -4px;
        width: 70px;
        height: 53px;
        transform-origin: 0 100%;
        animation: scribble 0.22s alternate infinite;
      }
      .post {
        width: min(480px, 100%);
        text-align: center;
      }
      .box-art {
        width: min(320px, 84%);
        display: block;
        margin: auto;
        overflow: visible;
      }
      .post button {
        margin-top: 16px;
        background: #f3ecd9;
        color: #28392f;
      }
      .post button:disabled {
        opacity: 0.75;
        cursor: default;
      }
      .mail-in {
        transform-box: view-box;
        transform-origin: 150px 103px;
        animation: insert 1.05s ease-in-out both;
      }
      @keyframes insert {
        0% {
          transform: translate(-12px, -66px) rotate(-12deg);
        }
        100% {
          transform: translateY(32px);
        }
      }
      .post.collect .door {
        transform-origin: 150px 238px;
        animation: lower 0.5s ease-out forwards;
      }
      @keyframes lower {
        to {
          transform: scaleY(0.19);
        }
      }
      .post.collect .stored {
        animation: retrieve 0.7s 0.18s ease-out both;
        transform-origin: center;
      }
      @keyframes retrieve {
        to {
          transform: translateY(-32px) scale(1.14);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .mail-in {
          transform: translateY(32px);
        }
      }
    </style>
  </head>
  <body>
    <div class="sky" aria-hidden="true">
      <svg class="fault" viewBox="0 0 1440 900" preserveAspectRatio="xMidYMid slice">
        <path
          d="M1040-40l-21 187 53 71-94 112 37 81-49 131 15 97-83 105-27 204m107-618-84-16-45 37-71 4m188 187 95 55 77-10 79 57"
          fill="none"
          stroke="#c7c49f"
          stroke-width="1"
        />
      </svg>
    </div>
    <main>
      <section class="draft" aria-label="Написание письма">
        <h1>Для мамы</h1>
        <div class="strokes" aria-hidden="true">
          <span id="ink"></span
          ><span class="nib"
            ><svg viewBox="0 0 80 60" fill="none">
              <path
                d="M34 23q8-10 14-9l28 8-6 20-16-4-10 2-15-8q-4-3-1-5z"
                fill="#dcb995"
                stroke="#795b46"
              />
              <path d="M2 56l6-12L52 3l4 4L13 49z" fill="#354e40" stroke="#29392c" />
              <path d="M2 56l6-12 5 5z" fill="#be955a" />
              <path
                d="M59 23l-12-5-12 8q-6 4-8 0-1-2 2-5l12-12q4-3 10-2l25 9-3 12"
                fill="#e6c4a1"
                stroke="#795b46"
              />
              <path d="M70 14l10 3v28l-15-5z" fill="#556754" /></svg
          ></span>
        </div>
        <p id="writing-status" role="status">Пишу письмо…</p>
        <button id="send" type="button">Допишем сразу</button>
      </section>
      <section class="post" hidden aria-label="Почтовый ящик">
        <svg class="box-art" viewBox="0 0 300 280" aria-hidden="true">
          <defs>
            <clipPath id="slot"><rect width="300" height="106" /></clipPath>
          </defs>
          <rect x="47" y="58" width="206" height="201" rx="13" fill="#24382e" />
          <rect
            x="42"
            y="53"
            width="206"
            height="201"
            rx="12"
            fill="#934b3f"
            stroke="#c3836b"
            stroke-width="2"
          />
          <rect x="61" y="91" width="168" height="17" rx="5" fill="#412f29" />
          <g clip-path="url(#slot)">
            <g class="mail-in" fill="#f2e1bd" stroke="#aa916c">
              <rect x="88" y="74" width="114" height="44" rx="2" />
              <path d="m88 74 57 32 57-32" fill="none" />
            </g>
          </g>
          <rect x="64" y="122" width="163" height="115" rx="6" fill="#382c26" />
          <g class="stored">
            <rect x="87" y="151" width="116" height="65" rx="2" fill="#f2e1bd" />
            <path d="m88 152 57 38 57-38" fill="none" stroke="#b89d76" />
          </g>
          <g class="door">
            <rect x="64" y="122" width="163" height="115" rx="6" fill="#a45546" stroke="#753e34" />
            <rect x="108" y="152" width="77" height="27" rx="2" fill="#e5cfaa" />
            <text
              x="146"
              y="170"
              fill="#513c31"
              text-anchor="middle"
              font-family="Georgia"
              font-size="14"
            >
              Для мамы
            </text>
            <circle cx="145" cy="206" r="6" fill="#d0a775" />
            <path d="M145 204v5" stroke="#594434" />
          </g>
        </svg>
        <button id="collect" disabled>Опускаем письмо…</button>
      </section>
      <button hidden class="envelope" id="envelope" type="button">
        <strong>Для мамы</strong><small>Распечатать письмо</small>
      </button>
      <article class="card" hidden>
        <section aria-labelledby="title">
          <h1 id="title" tabindex="-1">Мам, привет.</h1>
          <p>
            Люблю твою улыбку, мам. Особенно когда ты пытаешься сохранить серьёзное лицо, а я всё
            равно вижу, что тебе смешно.
          </p>
          <p>Надеюсь, этот рыжий тоже тебя рассмешит. У него тут для тебя кое-что припрятано.</p>
          <p class="signature">Люблю тебя.<span class="ink-heart" aria-hidden="true">♡</span></p>
          <div class="actions">
            <button id="reveal" type="button" aria-controls="photo" aria-expanded="false">
              Открыть подарок
            </button>
          </div>
        </section>
        <figure>
          <div class="photo" id="photo">
            <img id="cat" src="cat.webp" alt="Рыжий котёнок стоит на задних лапках" />
            <img
              id="gift"
              src="gift.webp"
              alt="Котёнок с букетом красных роз и шоколадкой"
              aria-hidden="true"
            />
          </div>
          <figcaption>
            <span id="caption" aria-live="polite"></span
            ><button class="pet" type="button">Погладить</button>
          </figcaption>
        </figure>
      </article>
    </main>
    <script>
      const sky = document.querySelector(".sky");
      for (let i = 0; i < 24; i++) {
        const line = document.createElement("span");
        line.className = "ray";
        line.style.cssText = `left:${i * 4.25}%;--duration:${8 + (i % 7)}s;--delay:-${(i * 1.73) % 14}s`;
        sky.append(line);
      }
      const reduced = matchMedia("(prefers-reduced-motion: reduce)");
      const envelope = document.querySelector("#envelope");
      const card = document.querySelector(".card");
      const post = document.querySelector(".post");
      const collect = document.querySelector("#collect");
      const draft = document.querySelector(".draft");
      const send = document.querySelector("#send");
      const ink = document.querySelector("#ink");
      const nib = document.querySelector(".nib");
      const statusLine = document.querySelector("#writing-status");
      const note = "Мам, привет. Люблю твою улыбку, мам.";
      let timer;
      function finishWriting() {
        clearInterval(timer);
        ink.textContent = note;
        nib.hidden = true;
        statusLine.textContent = "Письмо готово.";
        send.textContent = "Отправить маме";
      }
      if (reduced.matches) finishWriting();
      else
        timer = setInterval(() => {
          const length = ink.textContent.length + 1;
          ink.textContent = note.slice(0, length);
          if (length >= note.length) finishWriting();
        }, 80);
      send.addEventListener("click", () => {
        if (!nib.hidden) {
          finishWriting();
          return;
        }
        draft.hidden = true;
        post.hidden = false;
        setTimeout(
          () => {
            collect.disabled = false;
            collect.textContent = "Забрать письмо";
            collect.focus({ preventScroll: true });
          },
          reduced.matches ? 0 : 1050,
        );
      });
      collect.addEventListener("click", () => {
        collect.disabled = true;
        post.classList.add("collect");
        setTimeout(
          () => {
            post.hidden = true;
            envelope.hidden = false;
            envelope.focus({ preventScroll: true });
          },
          reduced.matches ? 0 : 900,
        );
      });
      envelope.addEventListener("click", () => {
        envelope.classList.add("opening");
        envelope.disabled = true;
        setTimeout(
          () => {
            envelope.hidden = true;
            card.hidden = false;
            card.classList.add("arrive");
            document.querySelector("#title").focus({ preventScroll: true });
          },
          reduced.matches ? 0 : 420,
        );
      });
      const photo = document.querySelector("#photo");
      const cat = document.querySelector("#cat");
      const gift = document.querySelector("#gift");
      const reveal = document.querySelector("#reveal");
      const caption = document.querySelector("#caption");
      reveal.addEventListener("click", () => {
        const open = photo.toggleAttribute("data-open");
        if (open) {
          const meow = new Audio("meow.ogg");
          meow.volume = 0.4;
          meow.play().catch(() => {});
        }
        cat.setAttribute("aria-hidden", String(open));
        gift.setAttribute("aria-hidden", String(!open));
        reveal.setAttribute("aria-expanded", String(open));
        reveal.textContent = open ? "Закрыть подарок" : "Открыть подарок";
        caption.textContent = open ? "Это тебе, мам." : "";
        if (open && matchMedia("(max-width:660px)").matches) {
          photo.scrollIntoView({
            block: "nearest",
            behavior: reduced.matches ? "instant" : "smooth",
          });
          if (!reduced.matches) navigator.vibrate?.(18);
        }
      });
      document.querySelector(".pet").addEventListener("click", () => {
        caption.textContent = "Мур.";
        if (reduced.matches) return;
        photo.classList.remove("purr");
        requestAnimationFrame(() => photo.classList.add("purr"));
      });
      photo.addEventListener("animationend", () => photo.classList.remove("purr"));
      window.addEventListener("pointermove", (event) => {
        if (reduced.matches || event.pointerType === "touch") return;
        const x = event.clientX / innerWidth;
        const y = event.clientY / innerHeight;
        sky.style.setProperty("--x", x * 100 + "%");
        sky.style.setProperty("--y", y * 100 + "%");
        sky.style.setProperty("--drift", (x - 0.5) * -15 + "px");
        photo.style.setProperty("--cat-x", (x - 0.5) * 9 + "px");
        photo.style.setProperty("--cat-y", (y - 0.5) * 7 + "px");
      });
    </script>
  </body>
</html>
